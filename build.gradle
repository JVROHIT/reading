plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Reading content: summarisation + quizing'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT support
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // LangChain4j for LLM client abstraction
    implementation 'dev.langchain4j:langchain4j-core:0.30.0'
    implementation 'dev.langchain4j:langchain4j-open-ai:0.30.0'
    implementation 'dev.langchain4j:langchain4j-anthropic:0.30.0'
    implementation 'dev.langchain4j:langchain4j-ollama:0.30.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Testcontainers for Docker-based integration tests
    testImplementation platform("org.testcontainers:testcontainers-bom:1.20.6")
  testImplementation "org.testcontainers:junit-jupiter"
  testImplementation "org.testcontainers:mongodb"
}

test {
    useJUnitPlatform()
}
configurations.configureEach {
  resolutionStrategy {
    force "org.testcontainers:testcontainers:1.20.6"
    force "org.testcontainers:junit-jupiter:1.20.6"
    force "org.testcontainers:mongodb:1.20.6"
  }
}

tasks.withType(Test).configureEach {
    environment "DOCKER_HOST", "unix:///var/run/docker.sock"
    // optional: makes logs clearer
    testLogging { exceptionFormat "full" }
}


tasks.named('test') {
	useJUnitPlatform()
}